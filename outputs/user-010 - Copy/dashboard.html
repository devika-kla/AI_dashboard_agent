<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPI Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #f8f8f6;
    --surface:  #ffffff;
    --border:   #e4e3dc;
    --text-1:   #1a1a18;
    --text-2:   #5f5e5a;
    --text-3:   #888780;
    --radius:   12px;
    --shadow:   0 1px 3px rgba(0,0,0,0.07), 0 1px 2px rgba(0,0,0,0.04);
  }



  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text-1);
    padding: 32px 24px;
    min-height: 100vh;
  }

  h1 {
    font-size: 20px;
    font-weight: 500;
    color: var(--text-1);
    margin-bottom: 24px;
    letter-spacing: -0.01em;
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-3);
    margin-bottom: 12px;
  }

  /* ── stat cards ── */
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 20px 18px;
    box-shadow: var(--shadow);
  }

  .stat-card .label {
    font-size: 12px;
    color: var(--text-2);
    margin-bottom: 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .stat-card .value {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--text-1);
  }

  .stat-card .sub {
    font-size: 11px;
    color: var(--text-3);
    margin-top: 6px;
  }

  /* ── chart panels ── */
  .chart-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(440px, 1fr));
    gap: 20px;
    margin-bottom: 32px;
  }

  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .chart-card .chart-title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-1);
    margin-bottom: 4px;
  }

  .chart-card .chart-desc {
    font-size: 12px;
    color: var(--text-3);
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .chart-card canvas {
    width: 100% !important;
    max-height: 280px;
  }

  /* ── failed panels ── */
  .failed-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 24px;
  }

  .failed-item {
    font-size: 12px;
    color: var(--text-3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
  }

  .failed-item strong { color: var(--text-2); }
</style>
</head>
<body>
